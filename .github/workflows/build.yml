name: Build Debian UZ801v3

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  decide:
    runs-on: ubuntu-24.04-arm
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        name: Check commit message for skip directive
        run: |
          msg="${{ github.event.head_commit.message }}"
          subject="${msg%%$'\n'*}"
          body="${msg#*$'\n'}"
          first_body_line="$(printf "%s" "$body" | awk 'NF{print; exit}')"
          skip="false"
          case "$subject" in
            "skip build:"*) skip="true" ;;
          esac
          case "$first_body_line" in
            "skip build:"*) skip="true" ;;
          esac
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  build:
    needs: decide
    if: needs.decide.outputs.skip != 'true'
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: sudo sh -e scripts/install_deps.sh

      - name: Build hyp and aboot firmware
        run: sudo sh -e scripts/build_hyp_aboot.sh

      - name: Extract firmware
        run: sudo sh -e scripts/extract_fw.sh

      - name: Create rootfs
        run: sudo sh -e scripts/debootstrap.sh

      - name: Build gadget-tool
        run: sudo sh -e scripts/build_gt.sh

      - name: Create images
        run: sudo sh -e scripts/build_images.sh

      - name: Determine artifact name
        id: artifact_name
        run: |
          branch="$GITHUB_REF_NAME"
          case "$branch" in
            debian)
              base="openstick-debian" ;;
            ubuntu-*)
              base="openstick-ubuntu" ;;
            *)
              # Fallback: sanitize branch for artifact naming
              sanitized=$(echo "$branch" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9' '-')
              base="openstick-${sanitized}" ;;
          esac
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "zip=${base}.zip" >> "$GITHUB_OUTPUT"

      - name: Zip artifact
        env:
          ZIP_NAME: ${{ steps.artifact_name.outputs.zip }}
        run: |
          python3 - << 'PY'
          import os, zipfile
          zip_name = os.environ['ZIP_NAME']
          with zipfile.ZipFile(zip_name, 'w', zipfile.ZIP_DEFLATED) as zf:
              for root, _dirs, files in os.walk('files'):
                  for f in files:
                      full = os.path.join(root, f)
                      arc = os.path.relpath(full, 'files')
                      zf.write(full, arc)
          print(f"Created {zip_name}")
          PY

      - name: Determine release tag
        id: get_tag
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            TAG_NAME="${{ github.event.release.tag_name }}"
          else
            TAG_NAME="debian-uz801-v3-build-2025-11-16"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Delete existing release assets
        uses: actions/github-script@v7
        with:
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            
            const targetRelease = releases.find(release => release.tag_name === '${{ steps.get_tag.outputs.tag_name }}');
            
            if (targetRelease) {
              console.log(`Found release with tag: ${{ steps.get_tag.outputs.tag_name }}`);
              console.log(`Release ID: ${targetRelease.id}`);
              
              const { data: assets } = await github.rest.repos.listReleaseAssets({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: targetRelease.id
              });
              
              console.log(`Found ${assets.length} assets to delete`);
              
              for (const asset of assets) {
                console.log(`Deleting asset: ${asset.name} (ID: ${asset.id})`);
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: asset.id
                });
              }
              
              console.log('All existing assets deleted');
            } else {
              console.log(`No release found with tag: ${{ steps.get_tag.outputs.tag_name }}`);
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_tag.outputs.tag_name }}
          files: |
            ${{ steps.artifact_name.outputs.zip }}
            $(pwd)/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
