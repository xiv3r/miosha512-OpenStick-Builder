name: file

on:
  workflow_dispatch:
  release:
    types: [published]
    
jobs:
  download-and-release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download files
      run: |
        mkdir -p downloads
        cd downloads
        wget -O openstick_debian.zip --load-cookies cookies.txt "https://productionresultssa14.blob.core.windows.net/actions-results/6fa877ec-f536-475d-a27a-2a82084203e1/workflow-job-run-4cdef9d6-e303-567f-a070-336f4716e79f/artifacts/6080b1de9436a9166a0a755df456f81a3d57c0db50092e947e9751ba2219f6ca.zip?rscd=attachment%3B+filename%3D%22openstick-debian.zip%22&se=2025-10-15T00%3A51%3A09Z&sig=CC2C4lQKVQU%2Be7Tf3rHLa3WX0u1CJy8z7rL%2BXUycQoA%3D&ske=2025-10-15T09%3A27%3A33Z&skoid=ca7593d4-ee42-46cd-af88-8b886a2f84eb&sks=b&skt=2025-10-14T21%3A27%3A33Z&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skv=2025-11-05&sp=r&spr=https&sr=b&st=2025-10-15T00%3A41%3A04Z&sv=2025-11-05ae83ade2a/artifacts/6080b1de9436a9166a0a755df456f81a3d57c0db50092e947e9751ba2219f6ca.zip?rscd=attachment%3B+filename%3D%22openstick-debian.zip%22&se=2025-10-12T00%3A43%3A14Z&sig=dLnYD3DJWl3Tum9YOut5LKWUCMceFt7Cik%2FJdlao%2FMA%3D&ske=2025-10-12T10%3A43%3A38Z&skoid=ca7593d4-ee42-46cd-af88-8b886a2f84eb&sks=b&skt=2025-10-11T22%3A43%3A38Z&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skv=2025-11-05&sp=r&spr=https&sr=b&st=2025-10-12T00%3A33%3A09Z&sv=2025-11-05"
                   
    - name: Determine release tag
      id: get_tag
      run: |
        if [ "${{ github.event_name }}" == "release" ]; then
          TAG_NAME="${{ github.event.release.tag_name }}"
        else
          TAG_NAME="debian-uz801-v3-build-2025-10-15"
        fi
        echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

    - name: Delete existing release assets
      uses: actions/github-script@v7
      with:
        script: |
          const { data: releases } = await github.rest.repos.listReleases({
            owner: context.repo.owner,
            repo: context.repo.repo
          });
          
          const targetRelease = releases.find(release => release.tag_name === '${{ steps.get_tag.outputs.tag_name }}');
          
          if (targetRelease) {
            console.log(`Found release with tag: ${{ steps.get_tag.outputs.tag_name }}`);
            console.log(`Release ID: ${targetRelease.id}`);
            
            const { data: assets } = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: targetRelease.id
            });
            
            console.log(`Found ${assets.length} assets to delete`);
            
            for (const asset of assets) {
              console.log(`Deleting asset: ${asset.name} (ID: ${asset.id})`);
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: asset.id
              });
            }
            
            console.log('All existing assets deleted');
          } else {
            console.log(`No release found with tag: ${{ steps.get_tag.outputs.tag_name }}`);
          }
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload files to existing release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.get_tag.outputs.tag_name }}
        files: |
          downloads/*.*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
